font_family "Thalia Medium"
font_size 12

disable_ligatures no
enable_audio_bell no

shell 			  zsh
shell_integration disabled

cursor_shape block

url_style curly

rember_window_size no 
initial_window_width 640
initial_window_height 480
window_padding_width 15
cursor_blink_interval 0

background_opacity 			  0.80
scrollbar_handle_opacity      0
scrollbar_track _opacity      0
scrollbar_track_hover_opacity 0
confirm_os_window_close 0

sync_to_monitor no 



#Farben
# Paulaner Spezi - Kitty Terminal Theme
# Inspiriert von der kultigen Spezi-Dose

foreground          #FFF1D6
background          #00264D

cursor              #FFB81C
cursor_text_color   #00264D

selection_foreground #00264D
selection_background #FFB81C

# Normale Farben
color0  #001A33   # Tiefstes Blau
color1  #E85D3F   # Warmes Rot
color2  #5B9E4F   # Grün
color3  #F5A623   # Spezi-Orange
color4  #0072C6   # Helleres Blau
color5  #9B6DB5   # Magenta
color6  #4BA3A0   # Cyan
color7  #E8D5B7   # Creme/Hell

# Helle Farben
color8  #004C99   # Hell-Blau
color9  #FF6B4A   # Hell-Rot
color10 #72C464   # Hell-Grün
color11 #FFB81C   # Hell-Orange/Gold
color12 #3399FF   # Leuchtblau
color13 #BD93D4   # Hell-Magenta
color14 #6BC5C0   # Hell-Cyan
color15 #FFF1D6   # Cremeweiß

# Borders & UI
#active_border_color     #F5A623
#inactive_border_color   #003B71
#bell_border_color       #E85D3F

# Tab Bar
active_tab_foreground   #00264D
active_tab_background   #F5A623
inactive_tab_foreground #6688AA
inactive_tab_background #003B71
tab_bar_background      #001A33
tab_bar_margin_width    0